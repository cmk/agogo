[package]
name = "agogo-host-midi"
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
license = "MIT"
publish = false

# `agogo-host-midi` is NOT a `[workspace].members` entry — it's
# pulled in only as an optional path dep from `crates/cli/Cargo.toml`
# when `agogo-cli --features midi` (or `--features demo`) is on,
# so the detached status keeps `cargo test --workspace` from eagerly
# pulling midir + its platform system deps
# (libasound on Linux, CoreMIDI framework on macOS, WinMM on
# Windows) into the default CI path.

[dependencies]
core_impl = { package = "agogo-core", path = "../core" }
# midir 0.10 is the current stable cross-platform MIDI binding;
# inherits its precision ceiling (~1 ms USB-bus jitter, see
# doc/agogo.md §4) which is the v0.1 baseline. Platform-native
# timestamped sinks (CoreMIDI / JACK / ALSA-MIDI / WinMM) tighten
# that as part of v0.2+ timing work.
midir = "0.10"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
