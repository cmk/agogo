[package]
name = "agogo-cli"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["core"]
core = ["dep:agogo-core"]
link = ["dep:agogo-host-link", "agogo-host-link/rusty-link"]
cpal = ["dep:agogo-host-cpal"]
midi = ["dep:agogo-host-midi"]
# `demo` activates the `agogo demo` subcommand: cpal audio in +
# midir MIDI out + the SPSC drain thread + CallbackState pipeline.
# Plan 13 T5.
demo = ["cpal", "midi"]

[dependencies]
agogo-core = { workspace = true, optional = true }
# Direct path deps (not workspace deps) — `crates/host-link`,
# `crates/host-cpal`, and `crates/host-midi` live outside
# `[workspace].members` so CI doesn't resolve their platform
# system deps (libasound, CoreAudio, WASAPI) unless their feature
# is explicitly requested.
agogo-host-cpal = { path = "../host-cpal", optional = true }
agogo-host-link = { path = "../host-link", optional = true }
agogo-host-midi = { path = "../host-midi", optional = true }
bpaf = { workspace = true }
