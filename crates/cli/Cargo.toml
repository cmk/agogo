[package]
name = "agogo-cli"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["core"]
core = ["dep:agogo-core"]
link = ["dep:agogo-host-link", "agogo-host-link/rusty-link"]
cpal = ["dep:agogo-host-cpal"]
midi = ["dep:agogo-host-midi"]
# `demo` activates the `agogo demo` subcommand: cpal audio in +
# midir MIDI out + the SPSC drain thread + CallbackState pipeline.
# Plan 13 T5.
demo = ["cpal", "midi"]
# `run` activates Plan 14's `agogo run`: N-channel Machine,
# six-rate static dispatch, Ctrl-C handling, top-level pipeline.
# Includes `link` so `--source link` is wired up; without `link`
# the handler errors cleanly on `--source link`.
run = ["demo", "link", "dep:ctrlc"]

[dependencies]
agogo-core = { workspace = true, optional = true }
# Direct path deps (not workspace deps) — `crates/host-link`,
# `crates/host-cpal`, and `crates/host-midi` live outside
# `[workspace].members` so CI doesn't resolve their platform
# system deps (libasound, CoreAudio, WASAPI) unless their feature
# is explicitly requested.
agogo-host-cpal = { path = "../host-cpal", optional = true }
agogo-host-link = { path = "../host-link", optional = true }
agogo-host-midi = { path = "../host-midi", optional = true }
bpaf = { workspace = true }
ctrlc = { version = "3", optional = true }

[dev-dependencies]
proptest = { workspace = true }

# Plan 14: explicit binary entry. `agogo` is the user-facing name
# (matches `doc/versions/version-0.1.md` acceptance literal). The
# default `agogo-cli` binary stays available for the v0.1 release
# so existing scripts keep working; remove in v0.2.
[[bin]]
name = "agogo"
path = "src/main.rs"

[[bin]]
name = "agogo-cli"
path = "src/main.rs"
