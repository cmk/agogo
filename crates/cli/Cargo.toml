[package]
name = "agogo-cli"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["core"]
core = ["dep:agogo", "agogo/core", "agogo/host"]
link = ["core", "agogo/link"]
cpal = ["dep:agogo", "agogo/cpal"]
midi = ["dep:agogo", "agogo/midi"]
# `demo` activates the `agogo demo` subcommand: cpal audio in +
# midir MIDI out + the SPSC drain thread + CallbackState pipeline.
demo = ["core", "cpal", "midi"]
# `run` activates `agogo run`: N-channel Playhead, six-rate static
# dispatch, Ctrl-C handling, top-level pipeline.
# Includes `link` so `--source link` is wired up; without `link`
# the handler errors cleanly on `--source link`.
run = ["demo", "link", "dep:ctrlc"]

[dependencies]
agogo = { path = "../agogo", default-features = false, optional = true }
# Optional backend features flow through the `agogo` facade. The
# backend crates still live outside `[workspace].members`, so CI
# doesn't resolve their platform system deps (libasound, CoreAudio,
# WASAPI) unless the matching feature is explicitly requested.
bpaf = { workspace = true }
ctrlc = { version = "3", optional = true }

[dev-dependencies]
proptest = { workspace = true }

# `agogo` is the user-facing binary name (matches
# `doc/versions/version-0.1.md` acceptance literal). The
# `agogo-cli` legacy alias was dropped in Plan 09 T4 — external
# scripts have migrated since v0.1, and the duplicate `[[bin]]`
# entry was generating a "found in multiple build targets" warning.
[[bin]]
name = "agogo"
path = "src/main.rs"

[[test]]
name = "demo"
path = "test/demo.rs"
required-features = ["demo"]

[[test]]
name = "link"
path = "test/link.rs"
required-features = ["link"]

[[test]]
name = "run"
path = "test/run.rs"
required-features = ["run"]
