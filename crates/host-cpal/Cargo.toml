[package]
name = "agogo-host-cpal"
edition = "2024"
version = "0.1.0"
rust-version = "1.92"
license = "MIT"
publish = false

# `agogo-host-cpal` is NOT a `[workspace].members` entry — it's
# pulled in only as an optional path dep from `crates/cli/Cargo.toml`
# when `agogo-cli --features cpal` (or `--features demo`) is on,
# so the detached status keeps `cargo test --workspace` from eagerly
# pulling cpal + its platform system deps
# (libasound on Linux, CoreAudio on macOS, WASAPI on Windows) into
# the default CI path. A dedicated `host-cpal` job in
# `.github/workflows/ci.yml` (with `working-directory:
# crates/host-cpal`) exercises this crate with the runner's
# `libasound2-dev` preinstalled.

[dependencies]
core_impl = { package = "agogo-core", path = "../core" }
# cpal 0.15 is the current stable; no newer version has changed the
# `build_input_stream` ABI we rely on.
cpal = "0.15"
# rtrb 0.3 — single-producer single-consumer ring buffer used by
# `cpal::control` to ferry MIDI messages from the audio callback
# (RT producer) to a drain thread that forwards to a `MidiSink`
# (typically `host-midi`'s `MidirSink`, which itself is not RT-safe).
rtrb = "0.3"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
