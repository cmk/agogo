[workspace]
members = [
    "crates/core",
    "crates/cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# Internal crates
agogo-core = { path = "crates/core" }

# Sibling crate. Hosted on GitLab; pinned by rev so the build is
# reproducible across local and CI. Local dev workflow: `cargo` will
# fetch the rev on first build and cache it. If you're co-developing
# agogo + connections on the same machine, add a gitignored
# `.cargo/config.toml` with a `[patch]` override pointing at
# `../connections` to avoid the cache-round-trip.
connections = { git = "https://gitlab.com/cmk/connections.git", rev = "85722866bebc62e9912a1c88057d209848528ac8" }

# Shared dependencies
clap = { version = "4", features = ["derive"] }
num-rational = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# Shared dev-dependencies
proptest = "1"
