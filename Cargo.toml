[workspace]
members = [
    "crates/agogo",
    "crates/core",
    "crates/cli",
    "crates/host",
]
# `crates/host-link` is intentionally NOT a workspace member — it
# lives as an optional path dep from `crates/cli` (activated by
# `agogo-cli --features link`). Keeping it out of `[workspace].members`
# prevents `cargo test --workspace` (default CI) from eagerly
# resolving its `rusty_link` path dep to `ext/rusty_link`, which is
# gitignored and absent on CI runners. See
# `crates/host-link/README.md` for the dev workflow.
#
# `ext/` similarly holds third-party path deps (rusty_link and
# friends) and is excluded so their tests / examples stay out of
# `cargo test --workspace`.
exclude = ["crates/host-cpal", "crates/host-link", "crates/host-midi", "ext"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# Internal crates
agogo-core = { path = "crates/core" }

# `agogo-host-link` + `rusty_link` are intentionally NOT workspace
# deps — they live as direct path deps from `crates/cli/Cargo.toml`
# (optional, behind the `link` feature). See
# `crates/host-link/README.md` for the setup instructions + pinned
# rusty_link rev.

# Sibling crate. Hosted on GitLab; pinned by rev so the build is
# reproducible across local and CI. Local dev workflow: `cargo` will
# fetch the rev on first build and cache it. If you're co-developing
# agogo + connections on the same machine, add a gitignored
# `.cargo/config.toml` with a `[patch]` override pointing at
# `../connections` to avoid the cache-round-trip.
connections = { git = "https://gitlab.com/cmk/connections.git", rev = "238a8aaf913db48a31c1d7409504fb9c2745d3cd" }

# Shared dependencies
bpaf = { version = "0.9", features = ["derive"] }
fixed = "1"
num-rational = "0.4"
rand = "0.9"
rand_distr = "0.5"
rand_pcg = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# Shared dev-dependencies
proptest = "1"
