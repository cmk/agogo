[workspace]
members = [
    "crates/core",
    "crates/cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# Internal crates
agogo-core = { path = "crates/core" }

# Sibling repos (sibling path; see doc/plans/plan-2026-04-22-01.md §T0)
connections = { path = "../connections" }

# Shared dependencies
clap = { version = "4", features = ["derive"] }
num-rational = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# Shared dev-dependencies
proptest = "1"
