name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt (warn only)
        run: cargo fmt --all -- --check
        continue-on-error: true
      - run: cargo test --workspace
      - run: cargo clippy --all-targets -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  floats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-floats.sh
        run: scripts/check-floats.sh

  # Excluded crates (not workspace members) — `cargo test --workspace`
  # in the `test` job above skips them by design (keeps the default
  # CI path off platform system deps). These dedicated jobs exercise
  # them with the runner's `libasound2-dev` preinstalled for ALSA.
  #
  # `-p <crate>` does not resolve detached crates from the workspace
  # root, so each job sets `working-directory` to the crate's path
  # and runs cargo from there.
  host-cpal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/host-cpal
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install ALSA dev headers
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

  host-midi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/host-midi
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install ALSA dev headers
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

  # Plan 2026-04-28-09 T2: pin the no-link cli build so future PRs
  # can't accidentally re-couple agogo-cli to agogo-host-link. The
  # `link` feature is gated behind `Command::Transport` and
  # `RunArgs.link_quantum` (in `cfg(feature = "run")`); this job
  # exercises the resulting feature graph.
  cli-no-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: cli builds without --features link
        run: cargo build -p agogo-cli --no-default-features --features core,cpal,midi
      - name: cli clippy without --features link
        run: cargo clippy -p agogo-cli --no-default-features --features core,cpal,midi --all-targets -- -D warnings
